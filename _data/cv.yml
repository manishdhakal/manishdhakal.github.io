- title: Ongoing Projects
  type: time_table
  contents:
    - title: DistillLens
      institution: Knowledge Compression for LLMs
      year: Oct 2025 - Present
      description:
        - Symmetric knowledge distillation that projects teacher and student intermediate hidden states into vocabulary space via the <b>logit lens</b> and aligns them with a <b>symmetric divergence</b>.
        - Outperforms standard distillation and feature-transfer baselines across GPT-2, Llama-2, and Qwen model families on instruction-following and math reasoning benchmarks, with no added inference cost.
    - title: DistillHPC
      institution: Scientific Code Generation <br> <i>Collaborator:</i> Oak Ridge National Laboratory (ORNL)
      year: May 2026 - Present
      description:
        - <b>Label-free knowledge distillation</b> to train compact coding assistants for the parallel programming languages used on DOE supercomputers, without human-authored expert examples.
    - title: Efficient World Models and VLAs
      institution: Embodied AI
      year: Aug 2026 - Present
      description:
        - Applying <b>efficient adaptation</b> and <b>knowledge compression</b> to world models and <b>vision-language-action (VLA)</b> models, so one shared model can be specialized to many tasks from limited demonstration data.
